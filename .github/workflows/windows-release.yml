name: Windows release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: monexus-windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    env:
      MONEXUS_RELEASE_VERSION: 1.4.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/desktop-model.test.mjs
      - run: npm run installer
      - name: Check a fresh per-user installation
        shell: pwsh
        run: |
          $installer = Resolve-Path 'release/Monexus-Workspace-Setup-x64.exe'
          $setup = Start-Process -FilePath $installer -ArgumentList '/quiet' -WindowStyle Hidden -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Setup returned $($setup.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs/Monexus Workspace'
          $app = Join-Path $root "app-$env:MONEXUS_RELEASE_VERSION/Monexus.exe"
          $updater = Join-Path $root 'MonexusSetup.exe'
          $startLink = Join-Path ([Environment]::GetFolderPath('Programs')) 'Monexus Workspace.lnk'
          $updateLink = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Update Monexus Workspace.lnk'
          foreach ($path in $app, $updater, $startLink, $updateLink) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Setup did not create $path" }
          }
          $probe = Start-Process -FilePath $app -ArgumentList '/check-webview' -WindowStyle Hidden -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Installed Monexus could not detect WebView2 ($($probe.ExitCode))" }
          $env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER = Join-Path $env:RUNNER_TEMP 'missing-webview2'
          $missing = Start-Process -FilePath $app -ArgumentList '/check-webview' -WindowStyle Hidden -Wait -PassThru
          if ($missing.ExitCode -ne 20) { throw "Expected the missing-runtime result, received $($missing.ExitCode)" }
          $shell = New-Object -ComObject WScript.Shell
          $update = $shell.CreateShortcut($updateLink)
          if ($shell.CreateShortcut($startLink).TargetPath -ine [IO.Path]::GetFullPath($app) -or
              $update.TargetPath -ine [IO.Path]::GetFullPath($updater) -or $update.Arguments -ne '/update') {
            throw 'Installed shortcuts point to the wrong target.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/Monexus-Workspace-Setup-x64.exe
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.4.${{ github.run_number }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already published."
          else
            gh release create "$RELEASE_TAG" Monexus-Workspace-Setup-x64.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Monexus Workspace ${RELEASE_TAG#v}" --notes "Windows x64 installer built from $GITHUB_SHA." --latest
          fi
